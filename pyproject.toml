[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuemseditor"
version = "0.1.0rc1"
description = "CUEMS Editor - WebSocket server for collaborative editing and project management"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
keywords = ["cuems", "editor", "websocket", "collaboration"]
authors = [
    { name = "CUEMS Team", email = "cuems@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "cuemsutils>=0.1.0rc9",
    "peewee>=3.17.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mkdocs",
]

[project.urls]
Homepage = "https://github.com/stagesoft/cuems-editor"
Documentation = "https://stagesoft.github.io/cuems-editor/"
Repository = "https://github.com/stagesoft/cuems-editor"
Issues = "https://github.com/stagesoft/cuems-editor/issues"

[project.scripts]
cuems-editor = "cuemseditor.cli:main"
cuems-editor-manual = "cuemseditor.run_manual:main"
cuems-editor-repair-durations = "cuemseditor.repair_durations:main"

[tool.hatch.version]
path = "src/cuemseditor/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
packages = ["src/cuemseditor"]

[tool.hatch.build.targets.wheel]
packages = ["src/cuemseditor"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
